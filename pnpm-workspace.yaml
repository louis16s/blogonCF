packages:
  - "."

overrides:
  brace-expansion@<2: 1.1.20
  brace-expansion@>=5 <6: 5.0.11
  browserslist: ^4.28.7
  fast-uri: ^3.1.7
  image-size: ^2.0.3
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  postcss: ^8.5.23
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  undici: ^7.29.1
  ws: ^8.21.0

allowBuilds:
  esbuild: true
  # sharp is an unused optional dependency in this Worker build. Explicitly
  # deny its install script so strict CI installs do not treat it as unreviewed.
  sharp: false
  unrs-resolver: true
  workerd: true
ignoredOptionalDependencies:
  # The Worker uses Cloudflare's image pipeline; Next's optional native sharp
  # release is currently outside its own declared safe semver range.
  - sharp
