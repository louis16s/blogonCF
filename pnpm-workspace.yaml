packages:
  - "."

overrides:
  brace-expansion@<2: 1.1.18
  brace-expansion@>=5 <6: 5.0.9
  fast-uri: ^3.1.5
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  postcss: ^8.5.23
  undici: ^7.29.0
  ws: ^8.21.0

allowBuilds:
  esbuild: true
  # sharp is an unused optional dependency in this Worker build. Explicitly
  # deny its install script so strict CI installs do not treat it as unreviewed.
  sharp: false
  unrs-resolver: true
  workerd: true
ignoredOptionalDependencies:
  # The Worker uses Cloudflare's image pipeline; Next's optional native sharp
  # release is currently outside its own declared safe semver range.
  - sharp
